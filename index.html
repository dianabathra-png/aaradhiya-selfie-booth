<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b37">
<title>Aaradhiya's Food Truck — Selfie Booth</title>
<style>
:root{color-scheme:dark;--gold:#ffd27a;--ink:#172b37}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#263c48,#101b22 65%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100svh;display:flex;justify-content:center}
main{width:min(100%,620px);padding:18px 14px 28px}
header{text-align:center;margin:4px 0 14px}
h1{font-size:clamp(25px,6vw,34px);margin:0;color:#fff;text-shadow:0 0 12px #35aaff}
header p{margin:5px 0 0;color:#f6d99d;font-size:12px;letter-spacing:.13em}
.stage{position:relative;width:100%;aspect-ratio:4/5;background:#26343b;border:2px solid #e5b75e;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #0008}
canvas{width:100%;height:100%;display:block}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:#fff;background:linear-gradient(#0005,#0009),url('truck-background.png') center/cover}
#placeholder span{background:#12232ddd;padding:12px 16px;border-radius:14px;line-height:1.5}
.controls{display:flex;gap:10px;margin-top:14px}
button{border:0;border-radius:999px;padding:14px 16px;font-size:15px;font-weight:700;flex:1;cursor:pointer}
button:focus-visible{outline:3px solid white;outline-offset:3px}
#start{background:var(--gold);color:#231b10}
#capture{background:#fff;color:#172b37}
#capture:disabled{opacity:.45;cursor:not-allowed}
#switch{background:#314956;color:#fff;flex:0 0 auto}
.note{text-align:center;color:#c6d0d5;font-size:12px;line-height:1.5;margin:12px 4px}
#status{min-height:20px;text-align:center;color:#ffe0a0;font-size:13px;margin-top:10px}
video{display:none}
</style>
</head>
<body>
<main>
<header><h1>Aaradhiya's Food Truck</h1><p>CAPTURE YOUR HAPPY MOMENTS</p></header>
<div class="stage">
  <canvas id="view" width="720" height="900"></canvas>
  <div id="placeholder"><span>Tap “Start selfie” and allow camera access.</span></div>
</div>
<div class="controls">
  <button id="start">Start selfie</button>
  <button id="capture" disabled>Take photo</button>
  <button id="switch" title="Switch camera" aria-label="Switch camera">↻</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
<p class="note">Stand a little away from the camera with your full face and shoulders visible. Use good front lighting for the cleanest result. Your photo is processed in this browser and is not uploaded by this page.</p>
<video id="video" playsinline muted></video>
</main>
<script type="module">
import { FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.querySelector('#video');
const canvas=document.querySelector('#view');
const ctx=canvas.getContext('2d');
const placeholder=document.querySelector('#placeholder');
const statusEl=document.querySelector('#status');
const startBtn=document.querySelector('#start');
const captureBtn=document.querySelector('#capture');
const switchBtn=document.querySelector('#switch');
const bg=new Image();
bg.src='truck-background.png';
let segmenter=null,stream=null,facing='user',running=false,processing=false,frameReady=false;
const W=canvas.width,H=canvas.height;
const personCanvas=document.createElement('canvas');personCanvas.width=W;personCanvas.height=H;
const personCtx=personCanvas.getContext('2d');
const maskCanvas=document.createElement('canvas');maskCanvas.width=W;maskCanvas.height=H;
const maskCtx=maskCanvas.getContext('2d');
const rawMaskCanvas=document.createElement('canvas');
const rawMaskCtx=rawMaskCanvas.getContext('2d',{willReadFrequently:true});

function say(message){statusEl.textContent=message;}
function stopStream(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}}
function drawCover(targetCtx,source,sw,sh,mirror=false){
  const scale=Math.max(W/sw,H/sh);
  const cropW=W/scale,cropH=H/scale;
  const sx=(sw-cropW)/2,sy=(sh-cropH)/2;
  targetCtx.save();
  if(mirror){targetCtx.translate(W,0);targetCtx.scale(-1,1);}
  targetCtx.drawImage(source,sx,sy,cropW,cropH,0,0,W,H);
  targetCtx.restore();
}
function drawBackground(){
  if(!bg.complete||!bg.naturalWidth)return;
  ctx.clearRect(0,0,W,H);
  drawCover(ctx,bg,bg.naturalWidth,bg.naturalHeight,false);
}
async function loadSegmenter(){
  if(segmenter)return;
  say('Loading selfie filter… this may take a moment.');
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  try{
    segmenter=await ImageSegmenter.createFromOptions(vision,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite',delegate:'GPU'},
      runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false
    });
  }catch(gpuError){
    segmenter=await ImageSegmenter.createFromOptions(vision,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite',delegate:'CPU'},
      runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false
    });
  }
}
async function startCamera(){
  try{
    running=false;stopStream();frameReady=false;captureBtn.disabled=true;
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:1600}}});
    video.srcObject=stream;await video.play();
    await loadSegmenter();
    placeholder.style.display='none';
    startBtn.textContent='Camera on';
    running=true;
    say('Camera ready — keep a little space around your head and shoulders.');
    requestAnimationFrame(render);
  }catch(error){
    stopStream();
    say('Camera/filter could not start. Allow camera access and check your internet connection. '+error.message);
  }
}
function render(){
  if(!running||processing)return;
  if(video.readyState>=2&&video.videoWidth>0){
    processing=true;
    try{
      segmenter.segmentForVideo(video,performance.now(),result=>{
        try{
          const mask=result.categoryMask;
          if(!mask){say('The selfie filter is not ready. Please try again.');return;}
          const mw=mask.width,mh=mask.height;
          rawMaskCanvas.width=mw;rawMaskCanvas.height=mh;
          const values=mask.getAsUint8Array();
          const pixels=rawMaskCtx.createImageData(mw,mh);
          for(let i=0;i<values.length;i++){
            const p=i*4;
            // Category 0 is background; the remaining category is the person.
            pixels.data[p]=255;pixels.data[p+1]=255;pixels.data[p+2]=255;
            pixels.data[p+3]=values[i]===0?0:255;
          }
          rawMaskCtx.putImageData(pixels,0,0);
          const mirrored=facing==='user';
          // Apply the exact same cover crop and mirror to the video and its mask.
          maskCtx.clearRect(0,0,W,H);
          drawCover(maskCtx,rawMaskCanvas,mw,mh,mirrored);
          personCtx.clearRect(0,0,W,H);
          drawCover(personCtx,video,video.videoWidth,video.videoHeight,mirrored);
          personCtx.globalCompositeOperation='destination-in';
          personCtx.drawImage(maskCanvas,0,0,W,H);
          personCtx.globalCompositeOperation='source-over';
          drawBackground();
          ctx.drawImage(personCanvas,0,0,W,H);
          frameReady=true;captureBtn.disabled=false;
          mask.close?.();
        }catch(error){say('Could not process this camera frame. '+error.message);}
        finally{processing=false;}
      });
    }catch(error){processing=false;say('Selfie filter error. Please restart the camera.');}
  }
  if(running)requestAnimationFrame(render);
}
startBtn.addEventListener('click',startCamera);
switchBtn.addEventListener('click',async()=>{facing=facing==='user'?'environment':'user';if(stream)await startCamera();else say('Camera will use the '+(facing==='user'?'front':'rear')+' camera when started.');});
captureBtn.addEventListener('click',()=>{
  if(!frameReady)return;
  const link=document.createElement('a');link.download='Aaradhiyas-Food-Truck-Selfie.png';link.href=canvas.toDataURL('image/png');link.click();say('Your selfie has been saved to your device.');
});
window.addEventListener('beforeunload',()=>{running=false;stopStream();segmenter?.close();});
bg.onload=drawBackground;
</script>
</body>
</html>
