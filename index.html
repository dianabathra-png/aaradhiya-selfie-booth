<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b37">
<title>Aaradhiya's Food Truck — Selfie Booth</title>
<style>
:root{color-scheme:dark;--gold:#ffd27a;--ink:#172b37}
*{box-sizing:border-box}
body{margin:0;background:#101b22;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100svh;display:flex;justify-content:center}
main{width:min(100%,620px);padding:18px 14px 28px}
header{text-align:center;margin:4px 0 14px}
h1{font-size:clamp(25px,6vw,34px);margin:0;color:#fff;text-shadow:0 0 12px #35aaff}
header p{margin:5px 0 0;color:#f6d99d;font-size:12px;letter-spacing:.13em}
.stage{position:relative;width:100%;aspect-ratio:4/5;background:#26343b;border:2px solid #e5b75e;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #0008}
canvas{width:100%;height:100%;display:block;object-fit:cover}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:#fff;background:linear-gradient(#0005,#0009),url('truck-background.png') center/cover}
#placeholder span{background:#12232ddd;padding:12px 16px;border-radius:14px}
.controls{display:flex;gap:10px;margin-top:14px}
button{border:0;border-radius:999px;padding:14px 16px;font-size:15px;font-weight:700;flex:1;cursor:pointer}
#start{background:var(--gold);color:#231b10}
#capture{background:#fff;color:#172b37}
#capture:disabled{opacity:.45;cursor:not-allowed}
#switch{background:#314956;color:#fff;flex:0 0 auto}
.note{text-align:center;color:#c6d0d5;font-size:12px;line-height:1.5;margin:12px 4px}
#status{min-height:20px;text-align:center;color:#ffe0a0;font-size:13px;margin-top:10px}
video{display:none}
</style>
</head>
<body>
<main>
<header><h1>Aaradhiya's Food Truck</h1><p>CAPTURE YOUR HAPPY MOMENTS</p></header>
<div class="stage">
  <canvas id="view" width="720" height="900"></canvas>
  <div id="placeholder"><span>Tap “Start selfie” and allow camera access.</span></div>
</div>
<div class="controls">
  <button id="start">Start selfie</button>
  <button id="capture" disabled>Take photo</button>
  <button id="switch" title="Switch camera" aria-label="Switch camera">↻</button>
</div>
<div id="status" role="status"></div>
<p class="note">Stand in front of the camera and keep your face and shoulders visible. Your selfie is processed in this browser; it is not uploaded by this page.</p>
<video id="video" playsinline muted></video>
</main>
<script type="module">
import { FilesetResolver, ImageSegmenter } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.querySelector("#video");
const canvas=document.querySelector("#view");
const ctx=canvas.getContext("2d");
const placeholder=document.querySelector("#placeholder");
const statusEl=document.querySelector("#status");
const startBtn=document.querySelector("#start");
const captureBtn=document.querySelector("#capture");
const switchBtn=document.querySelector("#switch");
const bg=new Image();
bg.src="truck-background.png";
let segmenter, stream, facing="user", running=false, lastTime=-1;
let maskCanvas=document.createElement("canvas");
let maskCtx=maskCanvas.getContext("2d",{willReadFrequently:true});
let personCanvas=document.createElement("canvas");
let personCtx=personCanvas.getContext("2d");

function say(s){statusEl.textContent=s}
function sizeCanvases(w,h){
  for(const c of [canvas,maskCanvas,personCanvas]){c.width=w;c.height=h}
}
async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:1600}}
    });
    video.srcObject=stream;
    await video.play();
    sizeCanvases(720,900);
    placeholder.style.display="none";
    captureBtn.disabled=false;
    startBtn.textContent="Camera on";
    say("Camera ready — stand in front of the camera.");
    if(!segmenter){
      say("Loading selfie filter…");
      const vision=await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      segmenter=await ImageSegmenter.createFromOptions(vision,{
        baseOptions:{modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite",
          delegate:"GPU"},
        runningMode:"VIDEO",outputCategoryMask:true,outputConfidenceMasks:false
      });
    }
    running=true;requestAnimationFrame(render);
  }catch(e){
    say("Could not start camera. Allow camera access and open this page using HTTPS. "+e.message);
  }
}
function render(){
  if(!running)return;
  if(video.readyState>=2 && video.currentTime!==lastTime){
    lastTime=video.currentTime;
    try{
      segmenter.segmentForVideo(video,performance.now(),result=>{
        const mask=result.categoryMask;
        if(!mask)return;
        const mw=mask.width,mh=mask.height;
        const data=mask.getAsUint8Array();
        const image=maskCtx.createImageData(mw,mh);
        for(let i=0;i<data.length;i++){
          const a=data[i]===0?0:255;
          const p=i*4;image.data[p]=255;image.data[p+1]=255;
          image.data[p+2]=255;image.data[p+3]=a;
        }
        maskCanvas.width=mw;maskCanvas.height=mh;
        maskCtx.putImageData(image,0,0);
        const W=canvas.width,H=canvas.height;
        ctx.clearRect(0,0,W,H);
        // Fit the truck background to the portrait selfie canvas.
        const scale=Math.max(W/bg.width,H/bg.height);
        const bw=bg.width*scale,bh=bg.height*scale;
        ctx.drawImage(bg,(W-bw)/2,(H-bh)/2,bw,bh);
        personCanvas.width=W;personCanvas.height=H;
        personCtx.save();
        personCtx.translate(W,0);personCtx.scale(-1,1);
        const s=Math.max(W/video.videoWidth,H/video.videoHeight);
        const vw=video.videoWidth*s,vh=video.videoHeight*s;
        personCtx.drawImage(video,(W-vw)/2,(H-vh)/2,vw,vh);
        personCtx.restore();
        personCtx.globalCompositeOperation="destination-in";
        personCtx.drawImage(maskCanvas,0,0,W,H);
        personCtx.globalCompositeOperation="source-over";
        ctx.drawImage(personCanvas,0,0,W,H);
        mask.close?.();
      });
    }catch(e){/* wait for next camera frame */}
  }
  requestAnimationFrame(render);
}
startBtn.addEventListener("click",startCamera);
switchBtn.addEventListener("click",async()=>{
  if(!stream){facing=facing==="user"?"environment":"user";return}
  facing=facing==="user"?"environment":"user";
  await startCamera();
});
captureBtn.addEventListener("click",()=>{
  const a=document.createElement("a");
  a.download="Aaradhiyas-Food-Truck-Selfie.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
  say("Your selfie has been saved to your device.");
});
window.addEventListener("beforeunload",()=>stream?.getTracks().forEach(t=>t.stop()));
bg.onload=()=>{ctx.drawImage(bg,0,0,canvas.width,canvas.height)};
</script>
</body>
</html>
